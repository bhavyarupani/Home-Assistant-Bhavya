      type: statistics-graph
      title: 💧 Water — Last 12 weeks
      chart_type: bar
      stat_types:
        - max
      period: week
      days_to_show: 84
      entities:
        - entity: sensor.water_weekly
          name: Weekly total (L)

  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Monthly
    card:
      type: statistics-graph
      title: 💧 Water — Last 12 months
      chart_type: bar
