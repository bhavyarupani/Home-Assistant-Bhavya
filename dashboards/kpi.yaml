        state: Daily
    card:
      type: entities
      title: 🔥 Heating — Today
      show_header_toggle: false
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_daily
          name: Bedroom heater (min)
          icon: mdi:radiator
        - entity: sensor.office_heater_heating_minutes_daily
          name: Office heater (min)
          icon: mdi:radiator
        - type: divider
        - entity: climate.bedroom_heater
          name: Bedroom target temp
        - entity: climate.office_heater
          name: Office target temp

  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Weekly
    card:
      type: entities
      title: 🔥 Heating — This Week
      show_header_toggle: false
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_weekly
          name: Bedroom heater (min)
          icon: mdi:radiator
        - entity: sensor.office_heater_heating_minutes_weekly
          name: Office heater (min)
          icon: mdi:radiator

  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Monthly
    card:
      type: entities
      title: 🔥 Heating — This Month
      show_header_toggle: false
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_monthly
          name: Bedroom heater (min)
          icon: mdi:radiator
        - entity: sensor.office_heater_heating_minutes_monthly
          name: Office heater (min)
          icon: mdi:radiator

  # 🔥 Heating trend graph — period-aware
  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Daily
    card:
      type: statistics-graph
      title: 🔥 Heating — Last 14 days
      chart_type: bar
      stat_types:
        - max
      period: day
      days_to_show: 14
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_daily
          name: Bedroom (min/day)
        - entity: sensor.office_heater_heating_minutes_daily
          name: Office (min/day)

  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Weekly
    card:
      type: statistics-graph
      title: 🔥 Heating — Last 12 weeks
      chart_type: bar
      stat_types:
        - max
      period: week
      days_to_show: 84
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_weekly
          name: Bedroom (min/week)
        - entity: sensor.office_heater_heating_minutes_weekly
          name: Office (min/week)

  - type: conditional
    conditions:
      - entity: input_select.kpi_period
        state: Monthly
    card:
      type: statistics-graph
      title: 🔥 Heating — Last 12 months
      chart_type: bar
      stat_types:
        - max
      period: month
      days_to_show: 365
      entities:
        - entity: sensor.bedroom_heater_heating_minutes_monthly
          name: Bedroom (min/month)
        - entity: sensor.office_heater_heating_minutes_monthly
          name: Office (min/month)

  # ═══════════════════════════════════════════════════════════════
  # 📊 ALL-TIME OVERVIEW — always visible regardless of filter
  # ═══════════════════════════════════════════════════════════════
  - type: entities
    title: 📊 Summary — All Periods
    show_header_toggle: false
    entities:
      - type: section
        label: ⚡ Electricity
      - entity: sensor.total_electricity_daily
        name: Today
      - entity: sensor.total_electricity_weekly
        name: This Week
      - entity: sensor.total_electricity_monthly
        name: This Month
      - type: section
        label: 💧 Water
      - entity: sensor.water_daily
        name: Today
      - entity: sensor.water_weekly
        name: This Week
      - entity: sensor.water_monthly
        name: This Month
      - type: section
        label: 🔥 Heating (bedroom)
      - entity: sensor.bedroom_heater_heating_minutes_daily
        name: Today
      - entity: sensor.bedroom_heater_heating_minutes_weekly
        name: This Week
      - entity: sensor.bedroom_heater_heating_minutes_monthly
        name: This Month
      - type: section
        label: 🔥 Heating (office)
      - entity: sensor.office_heater_heating_minutes_daily
        name: Today
      - entity: sensor.office_heater_heating_minutes_weekly
        name: This Week
      - entity: sensor.office_heater_heating_minutes_monthly
        name: This Month

  # ═══════════════════════════════════════════════════════════════
  # 🌡️ TEMPERATURE & ENVIRONMENT — always visible
  # ═══════════════════════════════════════════════════════════════
  - type: glance
    title: Environment
    show_name: true
    columns: 4
    entities:
      - entity: sensor.outdoor_temperature
        name: Outside
        icon: mdi:thermometer
      - entity: sensor.broadlink_temperature
        name: Indoor
        icon: mdi:home-thermometer
      - entity: sensor.broadlink_humidity
        name: Humidity
        icon: mdi:water-percent
      - entity: weather.forecast_home
        name: Weather
        icon: mdi:weather-partly-cloudy
