name: HA deploy
run-name: HA deploy ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Home Assistant"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - develop

jobs:
  deploy:
    name: Deploy ${{ inputs.branch }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    steps:
      - name: Explain SSH reachability requirement
        run: |
          cat <<'EOF'
          This workflow deploys from the self-hosted macOS runner so it can reach
          Home Assistant on the local network. If this job stays queued, start the
          Bhavyas-Laptop self-hosted runner and re-run the workflow.
          EOF

      - name: Deploy branch on Home Assistant
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HA_SSH_HOST }}
          port: ${{ secrets.HA_SSH_PORT }}
          username: ${{ secrets.HA_SSH_USER }}
          key: ${{ secrets.HA_SSH_KEY }}
          timeout: 20s
          command_timeout: 10m
          script_stop: true
          script: |
            bash <<'REMOTE_SCRIPT'
            set -euo pipefail

            BRANCH="${{ inputs.branch }}"
            if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "develop" ]; then
              echo "Unsupported branch: $BRANCH" >&2
              exit 2
            fi

            restart_home_assistant() {
              if ha core restart; then
                return 0
              fi

              echo "HA CLI restart failed; checking restart fallbacks." >&2
              echo "Available commands:" >&2
              for cmd in ha docker systemctl service hass; do
                if command -v "$cmd" >/dev/null 2>&1; then
                  echo "  $cmd: yes" >&2
                else
                  echo "  $cmd: no" >&2
                fi
              done

              if command -v docker >/dev/null 2>&1 && sudo -n docker ps --format '{{.Names}}' >/tmp/ha-docker-containers.txt 2>/dev/null; then
                echo "Docker containers:" >&2
                sed 's/^/  /' /tmp/ha-docker-containers.txt >&2
                for container in homeassistant home-assistant hass io-homeassistant-core; do
                  if grep -qx "$container" /tmp/ha-docker-containers.txt; then
                    sudo docker restart "$container"
                    return 0
                  fi
                done
              fi

              for service_name in home-assistant@homeassistant home-assistant homeassistant hass; do
                if command -v systemctl >/dev/null 2>&1 && sudo -n systemctl restart "$service_name" >/dev/null 2>&1; then
                  return 0
                fi
                if command -v service >/dev/null 2>&1 && sudo -n service "$service_name" restart >/dev/null 2>&1; then
                  return 0
                fi
              fi

              echo "Home Assistant config was updated, but restart failed." >&2
              echo "The HA CLI is unauthorized and no supported restart fallback worked." >&2
              exit 1
            }

            cd /config
            if [ -w /config/.git ]; then
              HA_DEPLOY_SKIP_RESTART=1 bash scripts/ha_branch_deploy.sh "$BRANCH" /config
              restart_home_assistant
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo HA_DEPLOY_SKIP_RESTART=1 bash scripts/ha_branch_deploy.sh "$BRANCH" /config
              restart_home_assistant
            else
              echo "The SSH user cannot write /config/.git and passwordless sudo is unavailable." >&2
              echo "Fix /config ownership/permissions or update HA_SSH_USER to a deploy-capable user." >&2
              exit 1
            fi
            REMOTE_SCRIPT
