- id: ha_sync_main_midnight
  alias: Home Assistant - sync main at midnight
  description: Pulls and deploys the latest main branch every night at 00:00.
  triggers:
    - trigger: time
      at: "00:00:00"
  actions:
    - action: script.deploy_home_assistant_main
  mode: single

- id: automation_health_weekly_email
  alias: Automation - Weekly Health Email
  description: Weekly report for disabled, unavailable, never-triggered, and stale automations.
  triggers:
    - trigger: time
      at: "18:00:00"
  conditions:
    - condition: time
      weekday:
        - sun
    - condition: template
      value_template: "{{ states('sensor.automation_health') != 'OK' }}"
  actions:
    - action: notify.bhavya_email
      data:
        title: "Home Assistant Automation Health"
        message: >
          Automation health: {{ states('sensor.automation_health') }}

          Unavailable ({{ state_attr('sensor.automation_health', 'unavailable_count') }}):
          {{ state_attr('sensor.automation_health', 'unavailable_automations') }}

          Disabled ({{ state_attr('sensor.automation_health', 'disabled_count') }}):
          {{ state_attr('sensor.automation_health', 'disabled_automations') }}

          Never triggered ({{ state_attr('sensor.automation_health', 'never_triggered_count') }}):
          {{ state_attr('sensor.automation_health', 'never_triggered_automations') }}

          Not triggered in 30+ days ({{ state_attr('sensor.automation_health', 'stale_count') }}):
          {{ state_attr('sensor.automation_health', 'stale_automations') }}
  mode: single

- id: "1718898933157"
  alias: Leave Home - Full Away Mode (per-device stagger)
  description: Leave home only if no occupancy; then turn off devices one-by-one with
    delays, set climate to 5C, disable away-managed automations
  triggers:
    - entity_id:
        - device_tracker.bhavyas_iphone
      from:
        - home
      to:
        - not_home
      for:
        hours: 0
        minutes: 2
        seconds: 0
      trigger: state
  conditions:
    - condition: state
      entity_id: binary_sensor.living_room_presence_sensor
      state: "off"
      for: 00:02:00
    - condition: state
      entity_id: binary_sensor.bedroom_presence_sensor
      state: "off"
      for: 00:02:00
    - condition: state
      entity_id: binary_sensor.hall_motion
      state: "off"
      for: 00:02:00
  actions:
    - repeat:
        for_each: "{{ media_players }}"
        sequence:
          - target:
              entity_id: "{{ repeat.item }}"
            action: media_player.turn_off
          - delay: "{{ delay_media }}"
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - target:
              entity_id: "{{ repeat.item }}"
            action: light.turn_off
          - delay: "{{ delay_lights }}"
    - repeat:
        for_each: "{{ switches }}"
        sequence:
          - target:
              entity_id: "{{ repeat.item }}"
            action: switch.turn_off
          - delay: "{{ delay_switches }}"
    - repeat:
        for_each: "{{ climates }}"
        sequence:
          - target:
              entity_id: "{{ repeat.item }}"
            data:
              hvac_mode: heat
            action: climate.set_hvac_mode
          - delay: "{{ delay_climate }}"
          - target:
              entity_id: "{{ repeat.item }}"
            data:
              temperature: 5
            action: climate.set_temperature
          - delay: "{{ delay_climate }}"
    - target:
        label_id: away_managed
      data:
        stop_actions: false
      action: automation.turn_off
  variables:
    exclude_entities: []
    delay_media: 00:00:03
    delay_lights: 00:00:02
    delay_switches: 00:00:04
    delay_climate: 00:00:03
    media_players: "{{ states.media_player\n  | map(attribute='entity_id')\n  | list
      }}"
    lights: "{{ states.light\n  | map(attribute='entity_id')\n  | reject('in', exclude_entities)\n
      \ | list }}"
    switches: "{{ states.switch\n  | map(attribute='entity_id')\n  | reject('in',
      exclude_entities)\n  | list }}"
    climates: "{{ states.climate\n  | map(attribute='entity_id')\n  | list }}"
  mode: single
- id: "1765221110611"
  alias: Enter Home - Enable Away-Managed Automations
  description: When I enter home, enable only the automations that were disabled on
    leave
  triggers:
    - entity_id:
        - device_tracker.bhavyas_iphone
      from:
        - not_home
      to:
        - home
      for:
        hours: 0
        minutes: 1
        seconds: 0
      trigger: state
  actions:
    - target:
        label_id: away_managed
      action: automation.turn_on
  mode: single
- id: "1765234997681"
  alias: Bhavya - Sleep Mode Manager
  description: Automatically set Bhavya sleep mode on/off based on time and iPhone
    activity only.
  triggers:
    - trigger: state
      entity_id: sensor.bhavyas_iphone_activity
      to: stationary
      for: 00:45:00
      id: maybe_sleep
    - trigger: state
      entity_id: sensor.bhavyas_iphone_activity
      id: phone_activity
    - trigger: time
      at: "09:00:00"
      id: wake_time
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: maybe_sleep
            - condition: time
              after: "22:30:00"
              before: "09:00:00"
            - condition: state
              entity_id: input_boolean.bhavya_sleep_mode
              state: "off"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.bhavya_sleep_mode
        - conditions:
            - condition: state
              entity_id: input_boolean.bhavya_sleep_mode
              state: "on"
            - condition: or
              conditions:
                - condition: trigger
                  id: wake_time
                - condition: and
                  conditions:
                    - condition: trigger
                      id: phone_activity
                    - condition: template
                      value_template: "{{ states('sensor.bhavyas_iphone_activity') not in ['stationary','unknown','unavailable'] }}"
                    - condition: time
                      after: "05:30:00"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.bhavya_sleep_mode
  mode: restart
- id: "1765305534323"
  alias: Energy - Daily Email Summary
  description: Send a daily electricity report with totals, data quality, and trend insights
  trigger:
    - platform: time
      at: "21:30:00"
  condition: []
  action:
    - action: notify.bhavya_email
      data:
        title: "Home Energy - {{ states('sensor.day_en') }} {{ states('sensor.date_en') }}"
        message: >
          {% set total = states('sensor.total_electricity_daily') | float(0) %}
          {% set measured = states('sensor.real_electricity_daily') | float(0) %}
          {% set estimated = states('sensor.virtual_electricity_daily') | float(0) %}
          {% set yesterday = state_attr('sensor.total_electricity_daily', 'last_period') | float(0) %}
          {% set weekly = states('sensor.total_electricity_weekly') | float(0) %}
          {% set monthly = states('sensor.total_electricity_monthly') | float(0) %}
          {% set daily_change = states('sensor.total_electricity_daily_change') | float(0) %}
          {% set weekly_change = states('sensor.total_electricity_weekly_change') | float(0) %}
          {% set monthly_change = states('sensor.total_electricity_monthly_change') | float(0) %}
          {% set estimated_share = states('sensor.electricity_estimated_share') | float(0) %}
          {% set live_power = states('sensor.total_electricity_power') | float(0) %}
          {% set measured_power = state_attr('sensor.total_electricity_power', 'measured_power_w') | float(0) %}
          {% set estimated_power = state_attr('sensor.total_electricity_power', 'estimated_power_w') | float(0) %}
          {% set measured_detail = state_attr('sensor.measured_electricity_power', 'active_detail') %}
          {% set estimated_detail = state_attr('sensor.virtual_electricity_power', 'active_detail') %}
          {% set active_estimated = state_attr('sensor.virtual_electricity_power', 'active_entities') | int(0) %}
          {% set tracked_total = states('sensor.electricity_registry_coverage') | int(0) %}
          {% set tracked_measured = state_attr('sensor.electricity_registry_coverage', 'measured_devices') | int(0) %}
          {% set tracked_estimated = state_attr('sensor.electricity_registry_coverage', 'estimated_devices') | int(0) %}
          {% set data_quality = states('sensor.electricity_data_quality') %}
          {% set registry_health = states('sensor.electricity_registry_health') %}
          {% set missing_watts = state_attr('sensor.electricity_registry_health', 'missing_assumed_watt') %}
          {% set max_bar = [total, yesterday, (weekly / 7 if weekly > 0 else 0)] | max %}
          {% set scale = 12 / max_bar if max_bar > 0 else 0 %}
          {% set today_bar = (total * scale) | round(0) | int %}
          {% set yesterday_bar = (yesterday * scale) | round(0) | int %}
          {% set week_avg = (weekly / 7) if weekly > 0 else 0 %}
          {% set week_bar = (week_avg * scale) | round(0) | int %}
          Hi Bhavya,

          Here is tonight's energy snapshot.

          TODAY
          Total tracked: {{ total | round(2) }} kWh
          Measured plugs: {{ measured | round(2) }} kWh
          Estimated lights/switches: {{ estimated | round(2) }} kWh ({{ estimated_share | round(0) }}%)
          Live power now: {{ live_power | round(0) }} W

          TREND
          Today      {{ '█' * today_bar }} {{ total | round(2) }} kWh
          Yesterday  {{ '█' * yesterday_bar }} {{ yesterday | round(2) }} kWh
          Week avg   {{ '█' * week_bar }} {{ week_avg | round(2) }} kWh

          Daily change: {{ daily_change | round(1) }}% - {{ states('sensor.total_electricity_daily_verdict') }}
          This week: {{ weekly | round(2) }} kWh ({{ weekly_change | round(1) }}%) - {{ states('sensor.total_electricity_weekly_verdict') }}
          This month: {{ monthly | round(1) }} kWh ({{ monthly_change | round(1) }}%) - {{ states('sensor.total_electricity_monthly_verdict') }}

          DATA QUALITY
          {{ data_quality }}
          Registry health: {{ registry_health }}
          Tracked devices: {{ tracked_total }} total ({{ tracked_measured }} measured, {{ tracked_estimated }} estimated)
          Measured now: {{ measured_power | round(0) }} W
          Estimated now: {{ estimated_power | round(0) }} W across {{ active_estimated }} active estimated entities
          Active measured: {{ measured_detail }}
          Active estimated: {{ estimated_detail }}
          {% if registry_health != 'OK' %}
          Missing watt assumptions: {{ missing_watts }}
          {% endif %}

          {% if total == 0 %}
          This is still reading 0 kWh. That usually means the running Home Assistant has not loaded the electricity sensors,
          the source power sensor is unavailable, or the utility meters were just created and have not had time to accumulate.
          {% elif daily_change > 10 %}
          Usage is meaningfully higher than yesterday. The fastest thing to check tonight is anything left on through the evening:
          plugs, monitor/TV gear, fans, and bright grouped lights.
          {% elif daily_change < -10 %}
          Nice drop versus yesterday. Whatever changed today is worth repeating: fewer always-on devices, shorter evening lighting, or less plug load.
          {% else %}
          Usage is steady. The best next improvement is increasing measured coverage so the report can separate real device loads from estimates.
          {% endif %}

          SMALL NEXT STEP
          {% if estimated_share > 50 %}
          More than half of today's number is estimated. Adding real power sensors for the biggest plugs would make this report much more accurate.
          {% elif measured == 0 %}
          Measured plug energy is 0 today. Check sensor.energy_real_power_sensors_w and the plugs feeding it.
          {% else %}
          The report has both measured and estimated data. Next useful upgrade would be naming the largest measured contributors individually.
          {% endif %}
  mode: single
- id: "1765487125446"
  alias: Heating Minute Counter
  description: Increment heater active minutes every 1 minute
  triggers:
    - trigger: time_pattern
      minutes: /1
  conditions: []
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.bedroom_heater_heating_minutes
          - sensor.office_heater_heating_minutes
  mode: single
- id: "1767652410481"
  alias: Spotify – Enforce Shuffle ON
  description: Keep Spotify shuffle always ON while playing
  triggers:
    - trigger: state
      entity_id: media_player.spotify_bhavya_rupani
      attribute: shuffle
      to: false
  conditions:
    - condition: state
      entity_id: media_player.spotify_bhavya_rupani
      state: playing
  actions:
    - action: media_player.shuffle_set
      target:
        entity_id: media_player.spotify_bhavya_rupani
      data:
        shuffle: true
  mode: single
- id: "1768425897109"
  alias: Office Heater - Smart Weekday Heating (Weather + Temp-aware)
  description: Preheats before 08:50 on workdays (BW holidays respected) if Bhavya's
    iPhone is at home, then maintains 20C. Skips if you left early. Adapts to outdoor
    temp and avoids heating if already warm.
  triggers:
    - minutes: /10
      trigger: time_pattern
    - entity_id: device_tracker.bhavyas_iphone
      to: home
      trigger: state
    - at: 08:50:00
      trigger: time
  conditions:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: "on"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: device_tracker.bhavyas_iphone
              state: not_home
          sequence:
            - target:
                entity_id: climate.office_heater
              data:
                hvac_mode: "off"
              action: climate.set_hvac_mode
        - conditions:
            - condition: state
              entity_id: input_boolean.skip_office_preheat_today
              state: "on"
          sequence:
            - target:
                entity_id: climate.office_heater
              data:
                hvac_mode: "off"
              action: climate.set_hvac_mode
        - conditions:
            - condition: state
              entity_id: device_tracker.bhavyas_iphone
              state: home
            - condition: time
              before: 08:50:00
          sequence:
            - condition: template
              value_template: "{{ state_attr('climate.office_heater','current_temperature')
                is number\n   and state_attr('climate.office_heater','current_temperature')
                < 20.5 }}\n"
            - variables:
                outside_ok: "{{ states('sensor.outdoor_temperature') not in ['unknown','unavailable','none','']
                  }}

                  "
                outside: "{{ states('sensor.outdoor_temperature') | float(99) }}

                  "
                preheat_target: "{% if not outside_ok %} 22 {% elif outside < 5 %} 23 {%
                  elif outside < 12 %} 22 {% else %} 21 {% endif %}

                  "
            - target:
                entity_id: climate.office_heater
              data:
                hvac_mode: heat
              action: climate.set_hvac_mode
            - target:
                entity_id: climate.office_heater
              data:
                temperature: "{{ preheat_target }}"
              action: climate.set_temperature
        - conditions:
            - condition: state
              entity_id: device_tracker.bhavyas_iphone
              state: home
            - condition: time
              after: 08:50:00
          sequence:
            - target:
                entity_id: climate.office_heater
              data:
                hvac_mode: heat
              action: climate.set_hvac_mode
            - target:
                entity_id: climate.office_heater
              data:
                temperature: 20
              action: climate.set_temperature
  mode: single
- id: "1768828283879"
  alias: Kitchen Occupancy Lighting (Anti-flicker)
  description: "Automatically controls kitchen ceiling light using occupancy sensor.
    Prevents flicker by turning lights off only after the kitchen remains unoccupied
    for 5 minutes (ideal for cooking and standing still).

    "
  triggers:
    - entity_id: binary_sensor.kitchen_presence_sensor_occupancy
      to: "on"
      trigger: state
    - entity_id:
        - binary_sensor.kitchen_presence_sensor_occupancy
      to:
        - "off"
      for:
        hours: 0
        minutes: 3
        seconds: 0
      trigger: state
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.kitchen_presence_sensor_occupancy
              state: "on"
          sequence:
            - action: light.turn_on
              data:
                color_temp_kelvin: 6500
                brightness_pct: 100
              target:
                entity_id: light.local_kitchen_ceiling_light
        - conditions:
            - condition: state
              entity_id: binary_sensor.kitchen_presence_sensor_occupancy
              state: "off"
          sequence:
            - condition: state
              entity_id: binary_sensor.kitchen_presence_sensor_occupancy
              state: "off"
            - action: light.turn_off
              data: {}
              target:
                entity_id: light.local_kitchen_ceiling_light
  mode: restart
- id: "1769036704899"
  alias: Bedroom Heater – Eco after 1 hour in bed
  description: "After being in_bed for 1 hour at night, reduce heating to eco to save
    gas.

    "
  triggers:
    - entity_id: input_select.bedroom_presence_state
      to: in_bed
      for:
        hours: 1
      trigger: state
  conditions:
    - condition: time
      after: "18:00:00"
      before: 07:00:00
  actions:
    - target:
        entity_id: climate.bedroom_heater
      data:
        temperature: 19
      action: climate.set_temperature
  mode: single
- id: "1769036792996"
  alias: Bedroom Heater – Day shutdown when not in bed
  description: "After 06:00, if bedroom presence state is NOT in_bed for 10 minutes,
    reduce heating to daytime eco so it doesn't run all day.

    "
  triggers:
    - entity_id:
        - input_select.bedroom_presence_state
      for:
        minutes: 10
      trigger: state
      to:
        - out_of_bed
        - awake_in_bed
        - empty
  conditions:
    - condition: time
      after: 06:00:00
    - condition: template
      value_template: "{{ states('input_select.bedroom_presence_state') != 'in_bed'
        }}

        "
  actions:
    - target:
        entity_id: climate.bedroom_heater
      data:
        temperature: 17
      action: climate.set_temperature
  mode: single
- id: "1769271547835"
  alias: Corridor – Light
  description: ""
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.corridor_presence_sensor
      to:
        - "on"
    - trigger: state
      entity_id:
        - binary_sensor.corridor_presence_sensor
      to:
        - "off"
      for:
        hours: 0
        minutes: 0
        seconds: 10
  conditions: []
  actions:
    - variables:
        present: "{{ is_state('binary_sensor.corridor_presence_sensor', 'on') }}"
        light_on: "{{ is_state('light.corridor_ceiling_lamp', 'on') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ present }}"
          sequence:
            - condition: template
              value_template: "{{ not light_on }}"
            - target:
                entity_id: light.corridor_ceiling_lamp
              data:
                color_temp_kelvin: 6500
                brightness_pct: 100
              action: light.turn_on
        - conditions:
            - condition: template
              value_template: "{{ (not present) and light_on }}"
          sequence:
            - target:
                entity_id: light.corridor_ceiling_lamp
              action: light.turn_off
  mode: restart
- id: "1770475979293"
  alias: Outside – Set Poor Natural Light Flag (Clouds + Weather)
  description: ""
  triggers:
    - entity_id:
        - weather.forecast_home
        - sensor.cloud_impact
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{% set clouds = states('sensor.cloud_impact') | float(0)
                %} {% set c = states('weather.forecast_home') %} {% set bad_conditions = [\n  'cloudy','rainy','pouring','fog','snowy','snowy-rainy','hail',\n
                \ 'lightning','lightning-rainy','exceptional','windy-variant'\n] %} {{ clouds
                >= 70 or c in bad_conditions }}\n"
          sequence:
            - target:
                entity_id: input_boolean.poor_natural_light_outside
              action: input_boolean.turn_on
      default:
        - target:
            entity_id: input_boolean.poor_natural_light_outside
          action: input_boolean.turn_off
  mode: single
- id: "1770476001160"
  alias: South Room – Smart Daylight Lighting
  description: ""
  triggers:
    - entity_id: sensor.south_room_daylight_score
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.south_room_daylight_score
              below: 35
          sequence:
            - target:
                entity_id: light.south_room_lights
              data:
                brightness_pct: 80
              action: light.turn_on
        - conditions:
            - condition: numeric_state
              entity_id: sensor.south_room_daylight_score
              above: 35
              below: 70
          sequence:
            - target:
                entity_id: light.south_room_lights
              data:
                brightness_pct: 40
              action: light.turn_on
      default:
        - target:
            entity_id: light.south_room_lights
          action: light.turn_off
  mode: single
- id: "1770476030943"
  alias: North Room – Smart Daylight Lighting
  description: ""
  triggers:
    - entity_id: sensor.north_room_daylight_score
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.north_room_daylight_score
              below: 50
          sequence:
            - target:
                entity_id: light.north_room_lights
              data:
                brightness_pct: 85
              action: light.turn_on
      default:
        - target:
            entity_id: light.north_room_lights
          action: light.turn_off
  mode: single
- id: "1770476577363"
  alias: Living Room – Ceiling Light
  triggers:
    - trigger: state
      entity_id: binary_sensor.living_room_presence_sensor
    - trigger: state
      entity_id: sensor.living_room_presence_sensor_human_motion_state
      to: "Off"
      for: 00:01:00
    - trigger: numeric_state
      entity_id: sensor.living_room_natural_light
      below: 20
      for: 00:02:00
    - trigger: numeric_state
      entity_id: sensor.living_room_natural_light
      above: 30
      for: 00:02:00
    - trigger: state
      entity_id: input_boolean.poor_natural_light_outside
  conditions: []
  actions:
    - variables:
        present: "{{ not is_state('binary_sensor.living_room_presence_sensor', 'off')
          }}"
        poor_light: "{{ is_state('input_boolean.poor_natural_light_outside', 'on')
          }}"
        score: "{{ states('sensor.living_room_natural_light') | float(-1) }}"
        dark_now: "{{ poor_light or score < 20 }}"
        bright_now: "{{ (score > 30) and (not poor_light) }}"
        light_on: "{{ is_state('light.living_room_ceiling_light', 'on') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ present and dark_now }}"
          sequence:
            - condition: template
              value_template: "{{ not light_on }}"
            - target:
                entity_id: light.living_room_ceiling_light
              data:
                color_temp_kelvin: 6500
              action: light.turn_on
        - conditions:
            - condition: template
              value_template: "{{\n  light_on\n  and\n  (\n    (not present)\n    or bright_now\n
                \ )\n}}\n"
          sequence:
            - delay: 00:00:10
            - condition: template
              value_template: "{{\n  is_state('light.living_room_ceiling_light', 'on')\n
                \ and\n  (\n    (is_state('binary_sensor.living_room_presence_sensor', 'off'))\n
                \   or\n    (\n      (states('sensor.living_room_natural_light') | float(-1))
                > 30\n      and is_state('input_boolean.poor_natural_light_outside', 'off')\n
                \   )\n  )\n}}\n"
            - target:
                entity_id: light.living_room_ceiling_light
              action: light.turn_off
  mode: restart
- id: "1770477766502"
  alias: Bedroom – Smart Lights (Final Stable Logic)
  description: ""
  triggers:
    - trigger: state
      entity_id: binary_sensor.bedroom_presence_sensor
    - trigger: state
      entity_id: sensor.bedroom_presence_sensor_human_motion_state
    - trigger: numeric_state
      entity_id: sensor.bedroom_presence_sensor_distance
      above: 140
      for: 00:00:10
    - trigger: state
      entity_id:
        - remote.bedroom_tv
        - input_boolean.poor_natural_light_outside
    - trigger: numeric_state
      entity_id: sensor.south_room_daylight_score
      below: 38
      for: 00:02:00
    - trigger: numeric_state
      entity_id: sensor.south_room_daylight_score
      above: 68
      for: 00:05:00
  conditions: []
  actions:
    - variables:
        room_present: "{{ states('binary_sensor.bedroom_presence_sensor') != 'off'
          }}"
        motion_raw: "{{ states('sensor.bedroom_presence_sensor_human_motion_state')
          }}"
        motion: "{{ (motion_raw | string | lower) }}"
        distance: "{{ states('sensor.bedroom_presence_sensor_distance') | float(0)
          }}"
        tv_on: "{{ not is_state('remote.bedroom_tv', 'off') }}"
        poor_light: "{{ is_state('input_boolean.poor_natural_light_outside', 'on')
          }}"
        score: "{{ states('sensor.south_room_daylight_score') | float(-1) }}"
        dark_now: "{{ poor_light or score < 38 }}"
        bright_now: "{{ (score > 68) and (not poor_light) }}"
        night_time: "{{ now().hour >= 22 or now().hour < 7 }}"
        ceiling_on: "{{ is_state('light.bedroom_ceiling_light', 'on') }}"
        ambiance_on: "{{ is_state('light.bed_ambiance', 'on') }}"
        active_motion: "{{ room_present and motion in ['small','large'] }}"
        bed_mode: "{{\n  room_present\n  and motion == 'off'\n  and distance < 130\n
          \ and (night_time or not ceiling_on)\n}}\n"
        wake_mode: "{{\n  active_motion\n  and distance > 140\n}}\n"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not room_present }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ ceiling_on }}"
                  sequence:
                    - delay:
                        hours: 0
                        minutes: 0
                        seconds: 10
                        milliseconds: 0
                    - condition: template
                      value_template: "{{ states('binary_sensor.bedroom_presence_sensor')
                        == 'off' }}"
                    - target:
                        entity_id: light.bedroom_ceiling_light
                      action: light.turn_off
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ ambiance_on }}"
                  sequence:
                    - delay: 00:03:00
                    - condition: template
                      value_template: "{{ states('binary_sensor.bedroom_presence_sensor')
                        == 'off' }}"
                    - target:
                        entity_id: light.bed_ambiance
                      action: light.turn_off
        - conditions:
            - condition: template
              value_template: "{{\n  trigger.entity_id == 'binary_sensor.bedroom_presence_sensor'\n
                \ and trigger.from_state is not none\n  and trigger.from_state.state ==
                'off'\n  and room_present\n}}\n"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ night_time or tv_on }}"
                  sequence:
                    - target:
                        entity_id: light.bed_ambiance
                      data:
                        brightness_pct: "{{ 5 if tv_on else 15 }}"
                        color_temp_kelvin: 2200
                      action: light.turn_on
                - conditions:
                    - condition: template
                      value_template: "{{ not night_time and dark_now and not tv_on }}"
                  sequence:
                    - target:
                        entity_id: light.bedroom_ceiling_light
                      data:
                        color_temp_kelvin: 6500
                      action: light.turn_on
            - stop: Entry handled
        - conditions:
            - condition: template
              value_template: "{{\n  room_present\n  and not night_time\n  and not tv_on\n
                \ and dark_now\n}}\n"
          sequence:
            - condition: template
              value_template: "{{ not ceiling_on }}"
            - target:
                entity_id: light.bedroom_ceiling_light
              data:
                color_temp_kelvin: 6500
              action: light.turn_on
        - conditions:
            - condition: template
              value_template: "{{ bed_mode }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ ceiling_on }}"
                  sequence:
                    - delay: 00:02:00
                    - condition: template
                      value_template: "{{\n  (states('binary_sensor.bedroom_presence_sensor')
                        != 'off')\n  and ((states('sensor.bedroom_presence_sensor_human_motion_state')
                        | string | lower) == 'off')\n  and ((states('sensor.bedroom_presence_sensor_distance')
                        | float(0)) < 130)\n}}\n"
                    - target:
                        entity_id: light.bedroom_ceiling_light
                      action: light.turn_off
            - target:
                entity_id: light.bed_ambiance
              data:
                brightness_pct: "{{ 5 if tv_on else 10 }}"
                color_temp_kelvin: 2200
              action: light.turn_on
            - delay: 00:05:00
            - condition: template
              value_template: "{{\n  (states('binary_sensor.bedroom_presence_sensor') !=
                'off')\n  and ((states('sensor.bedroom_presence_sensor_human_motion_state')
                | string | lower) == 'off')\n  and ((states('sensor.bedroom_presence_sensor_distance')
                | float(0)) < 130)\n  and is_state('light.bed_ambiance','on')\n  and is_state('remote.bedroom_tv','off')\n}}\n"
            - target:
                entity_id: light.bed_ambiance
              action: light.turn_off
        - conditions:
            - condition: template
              value_template: "{{ wake_mode }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ night_time }}"
                  sequence:
                    - target:
                        entity_id: light.bed_ambiance
                      data:
                        brightness_pct: 15
                        color_temp_kelvin: 2200
                      action: light.turn_on
                - conditions:
                    - condition: template
                      value_template: "{{ not night_time and dark_now and not tv_on }}"
                  sequence:
                    - target:
                        entity_id: light.bedroom_ceiling_light
                      data:
                        color_temp_kelvin: 6500
                      action: light.turn_on
        - conditions:
            - condition: template
              value_template: "{{\n  room_present\n  and ceiling_on\n  and bright_now\n
                \ and not tv_on\n}}\n"
          sequence:
            - target:
                entity_id: light.bedroom_ceiling_light
              action: light.turn_off
  mode: restart
