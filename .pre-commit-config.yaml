repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        files: ^(\.github/|\.ci/|dashboards/|scripts/|src/|automations\.yaml|configuration\.yaml|README\.md).*
        exclude: ^src/frontend/themes/animated-weather-card/icons/
      - id: trailing-whitespace
        files: ^(\.github/|\.ci/|dashboards/|scripts/|src/|automations\.yaml|configuration\.yaml|README\.md).*
        exclude: ^src/frontend/themes/animated-weather-card/icons/

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]
        files: ^(\.github/|\.ci/|blueprints/|button_card_templates/|dashboards/|popup/|requirements/|src/|themes/|automations\.yaml|configuration\.yaml|known_devices\.yaml|ui-lovelace\.yaml).*\.(ya?ml)$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(\.github/|\.ci/|blueprints/|button_card_templates/|dashboards/|popup/|requirements/|src/|themes/|automations\.yaml|configuration\.yaml|known_devices\.yaml|ui-lovelace\.yaml|README\.md).*\.(ya?ml|json|md)$

  - repo: local
    hooks:
      - id: forbidden-tracked-files
        name: Forbidden tracked files
        entry: python3 scripts/check_forbidden_files.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-reference-validation
        name: Home Assistant reference validation
        entry: python3 scripts/validate_ha_references.py
        language: system
        pass_filenames: false
        files: \.(ya?ml|txt|py)$
