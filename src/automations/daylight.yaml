- id: "1770475979293"
  alias: Outside – Set Poor Natural Light Flag (Clouds + Weather)
  description: ""
  triggers:
    - entity_id:
        - weather.forecast_home
        - sensor.cloud_impact
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{% set clouds = states('sensor.cloud_impact') | float(0)
                %} {% set c = states('weather.forecast_home') %} {% set bad_conditions = [\n  'cloudy','rainy','pouring','fog','snowy','snowy-rainy','hail',\n
                \ 'lightning','lightning-rainy','exceptional','windy-variant'\n] %} {{ clouds
                >= 70 or c in bad_conditions }}\n"
          sequence:
            - target:
                entity_id: input_boolean.poor_natural_light_outside
              action: input_boolean.turn_on
      default:
        - target:
            entity_id: input_boolean.poor_natural_light_outside
          action: input_boolean.turn_off
  mode: single
- id: "1770476001160"
  alias: South Room – Smart Daylight Lighting
  description: ""
  triggers:
    - entity_id: sensor.south_room_daylight_score
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.south_room_daylight_score
              below: 35
          sequence:
            - target:
                entity_id: light.south_room_lights
              data:
                brightness_pct: 80
              action: light.turn_on
        - conditions:
            - condition: numeric_state
              entity_id: sensor.south_room_daylight_score
              above: 35
              below: 70
          sequence:
            - target:
                entity_id: light.south_room_lights
              data:
                brightness_pct: 40
              action: light.turn_on
      default:
        - target:
            entity_id: light.south_room_lights
          action: light.turn_off
  mode: single
- id: "1770476030943"
  alias: North Room – Smart Daylight Lighting
  description: ""
  triggers:
    - entity_id: sensor.north_room_daylight_score
      trigger: state
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.north_room_daylight_score
              below: 50
          sequence:
            - target:
                entity_id: light.north_room_lights
              data:
                brightness_pct: 85
              action: light.turn_on
      default:
        - target:
            entity_id: light.north_room_lights
          action: light.turn_off
  mode: single
