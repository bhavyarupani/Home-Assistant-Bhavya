- id: "1773919330341"
  alias: NFC - Love Notes Shuffle
  description: Play Love Notes playlist shuffled on Denon from NFC tag
  triggers:
    - tag_id: 5409db3d-00d5-4a57-a56b-bd171c8662fe
      trigger: tag
  conditions: []
  actions:
    - action: media_player.turn_on
      target:
        entity_id: media_player.denon_avr_s770h
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - action: media_player.clear_playlist
      metadata: {}
      target:
        entity_id:
          - media_player.denon_avr_s770h_2
      data: {}
    - action: media_player.volume_set
      target:
        entity_id: media_player.denon_avr_s770h_2
      data:
        volume_level: 0.32
    - action: music_assistant.play_media
      target:
        entity_id: media_player.denon_avr_s770h_2
      data:
        media_id: ytmusic://playlist/PLlKU6nPJF78IODYBG1Wpw7uvgEI36wlWZ
        media_type: playlist
        enqueue: play
    - delay: 00:00:02
    - action: media_player.shuffle_set
      target:
        entity_id: media_player.denon_avr_s770h_2
      data:
        shuffle: true
  mode: single
