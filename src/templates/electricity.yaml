      {% set change = states('sensor.virtual_electricity_daily_change')|float(0) %}
      {% if change < -5 %}
        Much better 👍
      {% elif change < 0 %}
        Slightly better 🙂
      {% elif change < 5 %}
        About the same 😐
      {% else %}
        Worse ⚠️
      {% endif %}

